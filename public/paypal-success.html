<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Payment Complete • Wear The Spectrum Hero</title>

<style>
html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  max-width:520px;
  width:100%;
  padding:28px;
  border-radius:18px;
  background:rgba(20,20,20,.85);
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  text-align:center;
}
h1{margin-top:0}
.btn{
  display:inline-block;
  margin-top:20px;
  padding:14px 20px;
  border-radius:12px;
  font-weight:800;
  text-decoration:none;
  color:#fff;
  border:1px solid rgba(255,255,255,.25);
}
.btn:hover{background:rgba(255,255,255,.08)}
.small{opacity:.7;font-size:13px;margin-top:10px}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>🎉 Thank you for your order!</h1>
    <p>Your payment was completed successfully.</p>

    <div class="small" id="orderLine">Finalizing order…</div>

    <a class="btn" href="./#/">
      Continue shopping
    </a>
  </div>
</div>

<script>
const WORKER_BASE = "https://YOUR-WORKER-NAME.workers.dev";

(async function () {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("token");

  if (!orderId) {
    document.getElementById("orderLine").textContent =
      "Missing PayPal order ID.";
    return;
  }

  document.getElementById("orderLine").textContent =
    "Order ID: " + orderId;

  try {
    await fetch(`${WORKER_BASE}/paypal/capture`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId })
    });
  } catch (e) {
    console.error("Capture failed", e);
  }
})();
</script>
</body>
</html>
